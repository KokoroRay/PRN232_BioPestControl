name: Build and Push BioPestControl Services

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: kokororay156

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - catalog-service
          - ordering-service
          - inventory-service
          - payment-service
          - trading-service
          - agri-expert-service
          - article-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/biopest-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/biopest-${{ matrix.service }}:${{ github.sha }}
