name: Deploy Infra (Redis & Kafka) to VM3

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/redis-kafka/**'
  workflow_dispatch:

jobs:
  deploy-infra:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Redis and Kafka
        shell: bash
        run: |
          echo "--- Setting up Redis and Kafka on VM3 ---"
          # The self-hosted runner executes on VM 3
          # Create the expected directory if it doesn't exist
          mkdir -p ~/infra/redis-kafka
          
          # Copy docker-compose.yml to the user's directory
          cp infrastructure/redis-kafka/docker-compose.yml ~/infra/redis-kafka/
          
          # Change directory and start the services
          cd ~/infra/redis-kafka
          
          # Pull latest images and run
          docker-compose pull
          docker-compose up -d
          
          echo "--- Deployment Complete. Services running: ---"
          docker ps | grep -E 'redis|kafka|zookeeper' || true
