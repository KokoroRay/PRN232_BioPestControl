name: Deploy Infra (Redis & Kafka) to VM3

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/redis-kafka/**'
  workflow_dispatch:

jobs:
  deploy-infra:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cleanup previous Prometheus config
        shell: bash
        env:
          VM3_PASSWORD: ${{ secrets.VM3_PASSWORD }}
          VM3_USERNAME: ${{ secrets.VM3_USERNAME }}
        run: |
          sshpass -p "$VM3_PASSWORD" ssh -o StrictHostKeyChecking=no $VM3_USERNAME@10.0.0.3 "echo \"$VM3_PASSWORD\" | sudo -S rm -rf ~/infra/redis-kafka/prometheus || true"

      - name: Copy Files to VM3
        shell: bash
        env:
          VM3_PASSWORD: ${{ secrets.VM3_PASSWORD }}
          VM3_USERNAME: ${{ secrets.VM3_USERNAME }}
        run: |
          sshpass -p "$VM3_PASSWORD" ssh -o StrictHostKeyChecking=no $VM3_USERNAME@10.0.0.3 "mkdir -p ~/infra/redis-kafka/prometheus"
          sshpass -p "$VM3_PASSWORD" scp -o StrictHostKeyChecking=no infrastructure/redis-kafka/docker-compose.yml $VM3_USERNAME@10.0.0.3:~/infra/redis-kafka/
          sshpass -p "$VM3_PASSWORD" scp -o StrictHostKeyChecking=no infrastructure/redis-kafka/prometheus/prometheus.yml $VM3_USERNAME@10.0.0.3:~/infra/redis-kafka/prometheus/

      - name: Deploy to VM3
        shell: bash
        env:
          VM3_PASSWORD: ${{ secrets.VM3_PASSWORD }}
          VM3_USERNAME: ${{ secrets.VM3_USERNAME }}
        run: |
          sshpass -p "$VM3_PASSWORD" ssh -o StrictHostKeyChecking=no $VM3_USERNAME@10.0.0.3 "cd ~/infra/redis-kafka && echo \"$VM3_PASSWORD\" | sudo -S docker rm -f zookeeper redis kafka prometheus grafana mongodb || true && echo \"$VM3_PASSWORD\" | sudo -S docker-compose pull && echo \"$VM3_PASSWORD\" | sudo -S docker-compose up -d && echo \"--- Deployment Complete. Services running: ---\" && echo \"$VM3_PASSWORD\" | sudo -S docker ps | grep -E 'redis|kafka|zookeeper|mongodb' || true"
