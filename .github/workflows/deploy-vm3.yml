name: Deploy Infra (Redis & Kafka) to VM3

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/redis-kafka/**'
  workflow_dispatch:

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Files to VM3
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM3_HOST }}
          username: ${{ secrets.VM3_USERNAME }}
          key: ${{ secrets.VM3_SSH_KEY }}
          password: ${{ secrets.VM3_PASSWORD }}
          source: "infrastructure/redis-kafka/docker-compose.yml"
          target: "~/infra/redis-kafka"
          strip_components: 2

      - name: Deploy to VM3
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM3_HOST }}
          username: ${{ secrets.VM3_USERNAME }}
          key: ${{ secrets.VM3_SSH_KEY }}
          password: ${{ secrets.VM3_PASSWORD }}
          script: |
            cd ~/infra/redis-kafka
            docker-compose pull
            docker-compose up -d
            echo "--- Deployment Complete. Services running: ---"
            docker ps | grep -E 'redis|kafka|zookeeper' || true
