name: Build and Push 8 Services

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted
    env:
      REGISTRY: 10.0.0.3:5000
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Files to VM3
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM3_HOST }}
          username: ${{ secrets.VM3_USERNAME }}
          key: ${{ secrets.VM3_SSH_KEY }}
          password: ${{ secrets.VM3_PASSWORD }}
          source: "infrastructure/docker-compose.yml,infrastructure/kong.yml"
          target: "~/infra"
          strip_components: 1

      - name: Deploy Kafka & Redis to VM3
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM3_HOST }}
          username: ${{ secrets.VM3_USERNAME }}
          key: ${{ secrets.VM3_SSH_KEY }}
          password: ${{ secrets.VM3_PASSWORD }}
          script: |
            cd ~/infra
            echo "${{ secrets.VM3_PASSWORD }}" | sudo -S docker rm -f zookeeper redis kafka kong-gateway || true
            echo "${{ secrets.VM3_PASSWORD }}" | sudo -S docker-compose up -d

      - name: Build and Push Services
        shell: bash
        run: |
          set -euo pipefail

          SERVICES=(
            "agri-expert-service"
            "catalog-service"
            "engagement-service"
            "identity-service"
            "inventory-service"
            "ordering-service"
            "payment-service"
            "trading-service"
          )

          for SVC in "${SERVICES[@]}"; do
            if [ -f "services/${SVC}/Dockerfile" ]; then
              CONTEXT="services/${SVC}"
            elif [ -f "${SVC}/Dockerfile" ]; then
              CONTEXT="${SVC}"
            else
              echo "Dockerfile not found for ${SVC} in services/${SVC} or ${SVC}"
              exit 1
            fi

            echo "--- Building ${SVC} ---"
            docker build -t "${REGISTRY}/${SVC}:${IMAGE_TAG}" "${CONTEXT}"

            echo "--- Pushing ${SVC} ---"
            docker push "${REGISTRY}/${SVC}:${IMAGE_TAG}"
          done

      - name: Deploy to K3s
        shell: bash
        run: |
          set -euo pipefail

          echo "--- Applying Manifests ---"
          kubectl apply -f k8s/namespace.yaml

          SERVICES=(
            "agri-expert-service"
            "catalog-service"
            "engagement-service"
            "identity-service"
            "inventory-service"
            "ordering-service"
            "payment-service"
            "trading-service"
          )

          for SVC in "${SERVICES[@]}"; do
            kubectl create configmap "${SVC}-env" \
              --from-env-file="deploy/env/${SVC}.env" \
              -n biopest \
              --dry-run=client -o yaml | kubectl apply -f -
          done

          kubectl apply -f k8s/

          for SVC in "${SERVICES[@]}"; do
            kubectl set image deployment/"${SVC}" "${SVC}"="${REGISTRY}/${SVC}:${IMAGE_TAG}" -n biopest
            kubectl rollout status deployment/"${SVC}" -n biopest --timeout=180s
          done