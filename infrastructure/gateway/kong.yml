_format_version: "3.0"
_transform: true

services:
  # ----------------------------------------------------
  # 1. Identity Service
  # ----------------------------------------------------
  - name: identity-service
    url: http://<VM2_IP>:80
    routes:
      - name: identity-routes
        paths:
          - /api/auth
          - /api/admin/staffs
          - /api/admin/permissions
          - /api/admin/customers
          - /api/staff/customers
          - /api/profile
        strip_path: false

  # ----------------------------------------------------
  # 2. Agri-Expert Service
  # ----------------------------------------------------
  - name: agri-expert-service
    url: http://<VM2_IP>:80
    routes:
      - name: agri-expert-routes
        paths:
          - /api/chemicals
          - /api/staff/chemicals
          - /api/admin/chemicals
        strip_path: false

  # ----------------------------------------------------
  # 3. Catalog Service
  # ----------------------------------------------------
  - name: catalog-service
    url: http://<VM2_IP>:80
    routes:
      - name: catalog-routes
        paths:
          - /api/catalog
        strip_path: false

  # ----------------------------------------------------
  # 4. Article Service
  # ----------------------------------------------------
  - name: article-service
    url: http://<VM2_IP>:80
    routes:
      - name: article-routes
        paths:
          - /api/articles
        strip_path: false

  # ----------------------------------------------------
  # 5. Inventory Service
  # ----------------------------------------------------
  - name: inventory-service
    url: http://<VM2_IP>:80
    routes:
      - name: inventory-routes
        paths:
          - /api/inventory
        strip_path: false

  # ----------------------------------------------------
  # 6. Ordering Service
  # ----------------------------------------------------
  - name: ordering-service
    url: http://<VM2_IP>:80
    routes:
      - name: ordering-routes
        paths:
          - /api/orders
        strip_path: false

  # ----------------------------------------------------
  # 7. Payment Service
  # ----------------------------------------------------
  - name: payment-service
    url: http://<VM2_IP>:80
    routes:
      - name: payment-routes
        paths:
          - /api/payment
        strip_path: false

  # ----------------------------------------------------
  # 8. Trading Service
  # ----------------------------------------------------
  - name: trading-service
    url: http://<VM2_IP>:80
    routes:
      - name: trading-routes
        paths:
          - /api/trading
        strip_path: false

  # ----------------------------------------------------
  # 9. Frontend Web
  # ----------------------------------------------------
  - name: frontend-web
    url: http://<VM2_IP>:80
    routes:
      - name: frontend-routes
        paths:
          - /
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - Authorization
      credentials: true
      max_age: 3600
