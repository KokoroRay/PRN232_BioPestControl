apiVersion: apps/v1
kind: Deployment
metadata:
  name: engagement-service
  namespace: biopest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engagement-service
  template:
    metadata:
      labels:
        app: engagement-service
    spec:
      containers:
        - name: engagement-service
          image: 10.0.0.3:5000/engagement-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: engagement-service
  namespace: biopest
spec:
  selector:
    app: engagement-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
