apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biopest-ingress
  namespace: biopest
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: biopest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agri-expert-service
                port:
                  number: 80