services:
  agri-expert-service:
    build:
      context: .
      dockerfile: Dockerfile
      # Đảm bảo KHÔNG có dòng 'target: build' ở đây
    image: agri-expert-service:latest
    container_name: agri-expert-service

    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    env_file:
      - ../../deploy/env/agri-expert-service.env
