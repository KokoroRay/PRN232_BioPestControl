services:
  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      # Đảm bảo KHÔNG có dòng 'target: build' ở đây
    image: catalog-service:latest
    container_name: catalog-service
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    env_file:
      - ../../deploy/env/catalog-service.env
