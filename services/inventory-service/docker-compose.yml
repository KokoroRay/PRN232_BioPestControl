services:
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      # Đảm bảo KHÔNG có dòng 'target: build' ở đây
    image: inventory-service:latest
    container_name: inventory-service
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    env_file:
      - ../../deploy/env/inventory-service.env
