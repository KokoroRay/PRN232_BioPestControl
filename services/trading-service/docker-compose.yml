services:
  trading-service:
    build:
      context: .
      dockerfile: Dockerfile
      # Đảm bảo KHÔNG có dòng 'target: build' ở đây
    image: trading-service:latest
    container_name: trading-service
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    env_file:
      - ../../deploy/env/trading-service.env
